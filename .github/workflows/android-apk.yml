name: Build Mazraati Rabbits APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mazraati-rabbits-independent-0.8.21.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Extract verified project archive
        run: |
          test -f mazraati-rabbits-independent-0.8.21.zip
          unzip -t mazraati-rabbits-independent-0.8.21.zip
          mkdir project
          unzip -q mazraati-rabbits-independent-0.8.21.zip -d project
          PROJECT_DIR="$(find project -name package.json -type f -print -quit | xargs dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Install dependencies and validate
        run: |
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund
          npm run check
      - name: Build Android debug APK
        run: |
          cd "$PROJECT_DIR"
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mazraati-rabbits-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
